version: 2

snapshots:
  - name: clientes_snapshot
    description: >
      Histórico SCD2 de clientes (dbt snapshot, strategy=check sobre
      nome/cidade/estado/segmento). Cada cliente_id pode ter múltiplas
      versões (uma por período de vigência); a versão atual tem
      dbt_valid_to = null.
    columns:
      - name: cliente_id
        data_tests:
          - not_null
    data_tests:
      # garante que não existem duas versões com a mesma data de início de
      # vigência pro mesmo cliente — sinal de bug na lógica do snapshot
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - cliente_id
            - dbt_valid_from
